# Jeden Morgen: neue Spieler aus der App auswerten. Montags zusätzlich neue Partien aller Spieler.
# Danach App-Daten committen und die Seite neu veröffentlichen.
name: Partie-Analyse
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stockfish und python-chess installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq stockfish
          pip install -q chess
      - name: Partien holen und analysieren
        env:
          STOCKFISH: /usr/games/stockfish
        run: |
          if [ "$(date +%u)" = 1 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            python analysis/update_players.py --weekly
          else
            python analysis/update_players.py
          fi
      - name: Speichern und Seite neu veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data app/data
          if git diff --cached --quiet; then echo "Keine neuen Partien"; exit 0; fi
          git config user.name "Schachtrainer-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Partie-Analyse $(date +%d.%m.%Y)"
          git push
          gh workflow run pages.yml
